<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1326" width="960" height="1326" role="img" aria-label="pqw-skills at a glance: thirteen steps and the handoff phase on the flow axis, seven models on the thinking axis, one candid friend, plus the entry, teaching and writing skills and the bundled scripts">
