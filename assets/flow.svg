<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="单会话研发流：定义期由人主导六步，交接点之后交付期由代理自主，按切片循环，哨兵定时唤醒">
  <title>单会话研发流的形状</title>
  <style>
    .t { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #24292f; }
    .h { font-size: 17px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .loop { fill: none; stroke: #0969da; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .ln { fill: none; stroke: #57606a; stroke-width: 1.4; }
    .acc { stroke: #0969da; }
    .div { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 5; }
    .m { fill: #57606a; }
    .ma { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #c9d1d9; }
      .s { fill: #8b949e; }
      .box { fill: #161b22; stroke: #6e7681; }
      .ln { stroke: #8b949e; }
      .div { stroke: #6e7681; }
      .loop, .acc { stroke: #58a6ff; }
      .m { fill: #8b949e; }
      .ma { fill: #58a6ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ma"/></marker>
  </defs>

  <!-- 标题行 -->
  <text x="240" y="36" class="t h" text-anchor="middle">定义期 · 人主导</text>
  <text x="470" y="36" class="t s" text-anchor="middle">交接点</text>
  <text x="765" y="36" class="t h" text-anchor="middle">交付期 · 代理自主</text>
  <line x1="470" y1="48" x2="470" y2="540" class="div"/>

  <!-- 定义期：六步 -->
  <g class="t">
    <rect x="60" y="70" width="360" height="40" rx="6" class="box"/><text x="240" y="95" text-anchor="middle">1 需求与不变式</text>
    <rect x="60" y="150" width="360" height="40" rx="6" class="box"/><text x="240" y="175" text-anchor="middle">2 领域影响与顶层设计</text>
    <rect x="60" y="230" width="360" height="40" rx="6" class="box"/><text x="240" y="255" text-anchor="middle">3 技术调研与复用</text>
    <rect x="60" y="310" width="360" height="40" rx="6" class="box"/><text x="240" y="335" text-anchor="middle">4 形式化守护</text>
    <rect x="60" y="390" width="360" height="40" rx="6" class="box"/><text x="240" y="415" text-anchor="middle">5 细化领域设计</text>
    <rect x="60" y="470" width="360" height="40" rx="6" class="box"/><text x="240" y="495" text-anchor="middle">6 正式落盘与文档评审</text>
  </g>
  <g class="ln" marker-end="url(#a)">
    <line x1="240" y1="110" x2="240" y2="148"/>
    <line x1="240" y1="190" x2="240" y2="228"/>
    <line x1="240" y1="270" x2="240" y2="308"/>
    <line x1="240" y1="350" x2="240" y2="388"/>
    <line x1="240" y1="430" x2="240" y2="468"/>
  </g>
  <text x="240" y="540" class="t s" text-anchor="middle">每步回答一个问题、产出一样东西，是下一步的输入，顺序不能跳</text>

  <!-- 交接：6 到 7 -->
  <path d="M420,490 H450 V90 H518" class="ln" marker-end="url(#a)"/>

  <!-- 交付期 -->
  <g class="t">
    <rect x="520" y="70" width="260" height="40" rx="6" class="box"/><text x="650" y="95" text-anchor="middle">7 spec 与 plan</text>
    <rect x="520" y="130" width="260" height="40" rx="6" class="box"/><text x="650" y="155" text-anchor="middle">8 前置消熵：上下文包与开工包</text>
  </g>
  <g class="ln" marker-end="url(#a)">
    <line x1="650" y1="110" x2="650" y2="128"/>
    <line x1="650" y1="170" x2="650" y2="193"/>
  </g>

  <!-- 切片循环 -->
  <rect x="505" y="195" width="325" height="265" rx="8" class="loop"/>
  <text x="518" y="214" class="t s acc" style="fill:#0969da">每个切片</text>
  <g class="t">
    <rect x="520" y="225" width="260" height="40" rx="6" class="box"/><text x="650" y="250" text-anchor="middle">切片 TDD，9 派发只在过门时</text>
    <rect x="520" y="280" width="260" height="40" rx="6" class="box"/><text x="650" y="305" text-anchor="middle">11 切片收口：确定性验收</text>
    <rect x="520" y="335" width="260" height="40" rx="6" class="box"/><text x="650" y="360" text-anchor="middle">12 向人汇报</text>
    <rect x="520" y="390" width="260" height="40" rx="6" class="box"/><text x="650" y="415" text-anchor="middle">13 切片清理</text>
  </g>
  <g class="ln" marker-end="url(#a)">
    <line x1="650" y1="265" x2="650" y2="278"/>
    <line x1="650" y1="320" x2="650" y2="333"/>
    <line x1="650" y1="375" x2="650" y2="388"/>
  </g>
  <path d="M780,410 H805 V245 H782" class="ln acc" marker-end="url(#b)"/>
  <text x="821" y="340" class="t s" transform="rotate(-90 821 340)" text-anchor="middle">下一切片</text>

  <!-- 一程收尾 -->
  <line x1="650" y1="460" x2="650" y2="483" class="ln" marker-end="url(#a)"/>
  <rect x="520" y="485" width="260" height="40" rx="6" class="box"/>
  <text x="650" y="510" class="t" text-anchor="middle">13 一程交付后全盘清理</text>

  <!-- 哨兵 -->
  <rect x="850" y="285" width="170" height="86" rx="6" class="box"/>
  <text x="935" y="310" class="t" text-anchor="middle">10 哨兵子代理</text>
  <text x="935" y="333" class="t s" text-anchor="middle">便宜档，自己计时，只读</text>
  <text x="935" y="353" class="t s" text-anchor="middle">每 45 分钟回看并发消息</text>
  <line x1="850" y1="328" x2="833" y2="328" class="ln acc" marker-end="url(#b)"/>

  <text x="470" y="566" class="t s" text-anchor="middle">交接点：长期维护的知识已进唯一源并过评审</text>
</svg>
