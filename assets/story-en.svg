<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1500" width="960" height="1500" role="img" aria-label="pqw-skills in one picture: how a long run ends without it, how the same run goes with it, and the six things you get">
  <title>Hand a long run to your agent, and trust it</title>
  <style>
    /* kami 的皮肤：羊皮纸底、一个墨蓝强调色、暖灰、衬线字、细线、开口箭头。色值都取自 kami 的 tokens。 */
    svg { --bg:#f5f4ed; --ivory:#faf9f5; --ink:#141413; --mut:#504e49; --stone:#6b6a64; --line:#d8d5c8; --card:#faf9f5; --store:#EAE9E2; --brand:#1B365D; --tint:#EEF2F7;
          --human:#141413; --humanbg:#faf9f5; --agent:#1B365D; --agentbg:#EEF2F7; --pain:#141413; --painbg:#EAE9E2; --good:#1B365D; --goodbg:#EEF2F7; }
    text { font-family: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: var(--brand); letter-spacing: 3px; }
    .title { font-size: 36px; font-weight: 600; }
    .sub { font-size: 17px; fill: var(--mut); }
    .act { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 2.5px; }
    .h2 { font-size: 22px; font-weight: 600; }
    .h3 { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; fill: var(--mut); }
    .bi { font-size: 13px; }
    .s { font-size: 12px; fill: var(--stone); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; }
    .big { font-size: 24px; font-weight: 600; }
    .num { font-size: 30px; font-weight: 600; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .brandrule { stroke: var(--brand); stroke-width: 0.8; }
    .pain { fill: var(--pain); } .painbg { fill: var(--ink); stroke: var(--ink); stroke-width: 1; } .painln { stroke: var(--ink); fill: none; stroke-width: 1.5; }
    .human { fill: var(--human); } .humanbg { fill: var(--humanbg); stroke: var(--human); stroke-width: 1; } .humanln { stroke: var(--human); fill: none; }
    .agent { fill: var(--agent); } .agentbg { fill: var(--agentbg); stroke: var(--agent); stroke-width: 1; } .agentln { stroke: var(--agent); fill: none; stroke-width: 1.5; }
    .good { fill: var(--good); } .goodbg { fill: var(--goodbg); stroke: var(--good); stroke-width: 1; }
    .chip { fill: var(--ivory); stroke: var(--line); stroke-width: 1; }
    .arr { stroke: var(--mut); stroke-width: 1.4; fill: none; stroke-linecap: round; }
    .inv { fill: var(--ivory); }
    .invmut { fill: var(--line); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#504e49" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#1B365D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="1500"/>

  <!-- 标题 -->
  <text class="eyebrow" x="40" y="52">PQW-SKILLS</text>
  <text class="title" x="40" y="98">Hand a long run to your agent, and trust it</text>
  <text class="sub" x="40" y="130">You set the boundaries. It finishes the work. You come back only to verify.</text>
  <circle class="human" cx="760" cy="92" r="6"/><text class="b" x="772" y="97">you</text>
  <circle class="agent" cx="812" cy="92" r="6"/><text class="b" x="824" y="97">agent</text>
  <line class="brandrule" x1="40" y1="156" x2="920" y2="156"/>

  <!-- 第一幕 -->
  <text class="act" x="40" y="194" style="fill:var(--stone)">ACT 1</text>
  <text class="h2" x="104" y="196">Without it: how a long run usually ends</text>

  <g>
    <rect class="card" x="40" y="216" width="164" height="96" rx="6"/>
    <text class="h3" x="56" y="246">One-line kickoff</text>
    <text class="b" x="56" y="270">The need is unclear;</text><text class="b" x="56" y="290">it guesses the scope</text>

    <rect class="card" x="219" y="216" width="164" height="96" rx="6"/>
    <text class="h3" x="235" y="246">Drifts midway</text>
    <text class="b" x="235" y="270">Nobody is watching;</text><text class="b" x="235" y="290">it drifts further</text>

    <rect class="card" x="398" y="216" width="164" height="96" rx="6"/>
    <text class="h3" x="414" y="246">Patch on patch</text>
    <text class="b" x="414" y="270">Same spot, three fixes;</text><text class="b" x="414" y="290">premise never checked</text>

    <rect class="card" x="577" y="216" width="164" height="96" rx="6"/>
    <text class="h3" x="593" y="246">Says “all done”</text>
    <text class="b" x="593" y="270">Its own word;</text><text class="b" x="593" y="290">no evidence</text>

    <rect class="painbg" x="756" y="216" width="164" height="96" rx="6"/>
    <text class="h3 inv" x="772" y="246">A day of rework</text>
    <text class="b invmut" x="772" y="270">The costliest part</text><text class="b invmut" x="772" y="290">is your time</text>

    <path class="arr" d="M204,264 L217,264" marker-end="url(#m)"/>
    <path class="arr" d="M383,264 L396,264" marker-end="url(#m)"/>
    <path class="arr" d="M562,264 L575,264" marker-end="url(#m)"/>
    <path class="arr" d="M741,264 L754,264" marker-end="url(#m)"/>
  </g>

  <!-- 偏离曲线 -->
  <path fill="#EAE9E2" d="M40,392 L40,386 C300,382 560,370 740,346 C820,335 880,328 920,324 L920,392 Z" style="stroke:none"/>
  <path class="painln" d="M40,386 C300,382 560,370 740,346 C820,335 880,328 920,324"/>
  <text class="s pain" x="40" y="408">Drift</text>
  <text class="s" x="84" y="408">the longer you are away, the further it drifts and the more rework costs</text>
  <text class="s pain" x="920" y="408" text-anchor="end">Rework cost</text>

  <line class="rule" x1="40" y1="432" x2="920" y2="432"/>

  <!-- 第二幕 -->
  <text class="act agent" x="40" y="470">ACT 2</text>
  <text class="h2" x="104" y="472">With it: the same run goes like this</text>

  <!-- 注意力条 -->
  <text class="s human" x="40" y="508">Attention</text>
  <rect class="human" x="116" y="496" width="302" height="14" rx="3"/>
  <rect class="human" x="418" y="502" width="394" height="2"/>
  <rect class="human" x="812" y="496" width="108" height="14" rx="3"/>
  <text class="s" x="267" y="530" text-anchor="middle">Present, setting boundaries</text>
  <text class="s" x="644" y="530" text-anchor="middle">Away, doing other things</text>
  <text class="s" x="866" y="530" text-anchor="middle">Back, verifying</text>

  <!-- 定义期 -->
  <rect class="humanbg" x="40" y="546" width="378" height="250" rx="6"/>
  <text class="h3 human" x="58" y="576">Definition · you lead</text>
  <text class="s" x="400" y="576" text-anchor="end">six steps, in order</text>
  <g>
    <rect class="chip" x="58" y="592" width="166" height="36" rx="6"/><text class="bi" x="70" y="615">1  Need &amp; invariants</text>
    <rect class="chip" x="234" y="592" width="166" height="36" rx="6"/><text class="bi" x="246" y="615">2  Domain impact</text>
    <rect class="chip" x="58" y="636" width="166" height="36" rx="6"/><text class="bi" x="70" y="659">3  Research &amp; reuse</text>
    <rect class="chip" x="234" y="636" width="166" height="36" rx="6"/><text class="bi" x="246" y="659">4  Formal guard</text>
    <rect class="chip" x="58" y="680" width="166" height="36" rx="6"/><text class="bi" x="70" y="703">5  Detailed design</text>
    <rect class="chip" x="234" y="680" width="166" height="36" rx="6"/><text class="bi" x="246" y="703">6  Docs landing</text>
  </g>
  <text class="b" x="58" y="744">Each step answers one question and feeds the next.</text>
  <text class="b" x="58" y="766">The agent first asks: is this worth building?</text>

  <!-- 交接期：一小段接力区，设计会话做，人在场 -->
  <rect x="428" y="546" width="56" height="250" rx="6" style="fill:var(--humanbg);stroke:var(--human);stroke-width:1;stroke-dasharray:4 3"/>
  <text class="h3 human" x="456" y="576" text-anchor="middle">Relay</text>
  <g>
    <rect class="chip" x="432" y="592" width="48" height="30" rx="6"/><text class="bi" x="456" y="612" text-anchor="middle">Commit</text>
    <rect class="chip" x="432" y="638" width="48" height="30" rx="6"/><text class="bi" x="456" y="658" text-anchor="middle">Size</text>
    <rect class="goodbg" x="432" y="684" width="48" height="30" rx="6"/><text class="bi good" x="456" y="704" text-anchor="middle">Pass</text>
    <path class="arr" d="M456,623 L456,635" marker-end="url(#m)"/>
    <path class="arr" d="M456,669 L456,681" marker-end="url(#m)"/>
  </g>
  <text class="s" x="456" y="744" text-anchor="middle">one run</text>
  <text class="s" x="456" y="762" text-anchor="middle">at a time</text>

  <!-- 交付期 -->
  <rect class="agentbg" x="494" y="546" width="300" height="250" rx="6"/>
  <text class="h3 agent" x="510" y="576">Delivery · agent runs it</text>
  <text class="s" x="510" y="600">The plan cuts the run into slices; per slice:</text>
  <g>
    <rect class="chip" x="510" y="616" width="50" height="34" rx="6"/><text class="s" x="535" y="638" text-anchor="middle" style="fill:var(--ink)">Kickoff</text>
    <rect class="chip" x="568" y="616" width="50" height="34" rx="6"/><text class="s" x="593" y="638" text-anchor="middle" style="fill:var(--ink)">Right</text>
    <rect class="chip" x="626" y="616" width="50" height="34" rx="6"/><text class="s" x="651" y="638" text-anchor="middle" style="fill:var(--ink)">Well</text>
    <rect class="chip" x="684" y="616" width="50" height="34" rx="6"/><text class="s" x="709" y="638" text-anchor="middle" style="fill:var(--ink)">Close</text>
    <rect class="chip" x="742" y="616" width="40" height="34" rx="6"/><text class="s" x="762" y="638" text-anchor="middle" style="fill:var(--ink)">Report</text>
    <path class="arr" d="M560,633 L566,633" marker-end="url(#m)"/>
    <path class="arr" d="M618,633 L624,633" marker-end="url(#m)"/>
    <path class="arr" d="M676,633 L682,633" marker-end="url(#m)"/>
    <path class="arr" d="M734,633 L740,633" marker-end="url(#m)"/>
    <path class="agentln" d="M762,650 C762,678 535,678 535,653" stroke-dasharray="5 4" marker-end="url(#ma)"/>
    <text class="s agent" x="648" y="694" text-anchor="middle">next slice</text>
  </g>
  <circle class="agentln" cx="526" cy="738" r="14"/>
  <path class="agentln" d="M526,729 L526,738 L533,742"/>
  <text class="bi" x="550" y="734">A sentinel reviews every 45 min</text>
  <text class="s" x="550" y="754">Drift, loops, context rot: caught early</text>
  <text class="s" x="510" y="782">Done means evidence: tests, metrics, mutation</text>

  <!-- 验收 -->
  <rect class="humanbg" x="812" y="546" width="108" height="250" rx="6"/>
  <text class="h3 human" x="826" y="576">You return</text>
  <text class="bi" x="826" y="616">Read report</text>
  <text class="s" x="826" y="636">diagrams, demo</text>
  <text class="bi" x="826" y="676">Try it</text>
  <text class="s" x="826" y="696">minutes each</text>
  <text class="bi" x="826" y="736">Take back</text>
  <text class="s" x="826" y="756">then next run</text>

  <path class="arr" d="M418,607 L430,607" marker-end="url(#m)"/>
  <path class="arr" d="M481,699 L492,699" marker-end="url(#m)"/>
  <path class="arr" d="M794,666 L810,666" marker-end="url(#m)"/>

  <line class="rule" x1="40" y1="826" x2="920" y2="826"/>

  <!-- 第三幕 -->
  <text class="act agent" x="40" y="864">ACT 3</text>
  <text class="h2" x="104" y="866">Six things you get</text>

  <g>
    <rect class="card" x="40" y="886" width="280" height="186" rx="6"/>
    <text class="big" x="58" y="926">No wasted work</text>
    <text class="bi" x="58" y="958">Four questions before work starts:</text>
    <text class="bi" x="58" y="980">who needs it, how they cope today,</text>
    <text class="bi" x="58" y="1002">the smallest cut. It says so once.</text>
    <text class="mono agent" x="58" y="1050">candid-friend</text>

    <rect class="card" x="340" y="886" width="280" height="186" rx="6"/>
    <text class="big" x="358" y="926">No guessed scope</text>
    <text class="bi" x="358" y="958">Six steps remove uncertainty up front.</text>
    <text class="bi" x="358" y="980">The pass is a physical condition:</text>
    <text class="bi" x="358" y="1002">written down and reviewed.</text>
    <text class="mono agent" x="358" y="1050">six definition skills</text>

    <rect class="card" x="640" y="886" width="280" height="186" rx="6"/>
    <text class="big" x="658" y="926">No loose thinking</text>
    <text class="bi" x="658" y="958">Seven habits in every task: decompose,</text>
    <text class="bi" x="658" y="980">find the gap, shape, build, prove,</text>
    <text class="bi" x="658" y="1002">hand off, ask. Written into outputs.</text>
    <text class="mono agent" x="658" y="1050">think-*</text>

    <rect class="card" x="40" y="1092" width="280" height="186" rx="6"/>
    <text class="big" x="58" y="1132">No silent drift</text>
    <text class="bi" x="58" y="1164">An independent sentinel reviews on a</text>
    <text class="bi" x="58" y="1186">timer; the agent never grades itself.</text>
    <text class="bi" x="58" y="1208">Drift is caught now, not at dawn.</text>
    <text class="mono agent" x="58" y="1256">one-lesson-rule</text>

    <rect class="card" x="340" y="1092" width="280" height="186" rx="6"/>
    <text class="big" x="358" y="1132">No self-praise</text>
    <text class="bi" x="358" y="1164">Done means evidence: red-then-green</text>
    <text class="bi" x="358" y="1186">tests, structure metrics, mutation,</text>
    <text class="bi" x="358" y="1208">line-by-line checks. Not “I'm done”.</text>
    <text class="mono agent" x="358" y="1256">slice-closeout</text>

    <rect class="card" x="640" y="1092" width="280" height="186" rx="6"/>
    <text class="big" x="658" y="1132">No burnout for you</text>
    <text class="bi" x="658" y="1164">A run is sized by what you can verify.</text>
    <text class="bi" x="658" y="1186">Too big? It proposes several runs.</text>
    <text class="bi" x="658" y="1208">Nights: bedtime handoff, morning brief.</text>
    <text class="mono agent" x="658" y="1256">candid-friend</text>
  </g>

  <line class="rule" x1="40" y1="1306" x2="920" y2="1306"/>

  <!-- 一次对照 -->
  <rect class="card" x="40" y="1330" width="560" height="134" rx="6"/>
  <text class="h3" x="58" y="1360">One comparison: same request, only the skills differ</text>
  <text class="s" x="58" y="1380">Request: “add pause and resume to a download task”; write the slice kickoff</text>
  <rect class="chip" x="58" y="1394" width="252" height="54" rx="6"/>
  <text class="s" x="70" y="1416" style="font-weight:700">Without thinking models</text>
  <text class="s" x="70" y="1436">Transitions in prose, gaps glossed</text>
  <rect class="goodbg" x="322" y="1394" width="260" height="54" rx="6"/>
  <text class="s good" x="334" y="1416" style="font-weight:700">With thinking models</text>
  <text class="s" x="334" y="1436" style="fill:var(--ink)">6×5 totality table, all 30 cells answered</text>

  <!-- 数字 -->
  <rect class="card" x="620" y="1330" width="300" height="134" rx="6"/>
  <text class="num" x="650" y="1376">27</text><text class="s" x="696" y="1374">skills</text>
  <text class="num" x="790" y="1376">13</text><text class="s" x="836" y="1374">steps</text>
  <text class="num" x="650" y="1432">7</text><text class="s" x="676" y="1430">thinking models</text>
  <text class="num" x="790" y="1432">7</text><text class="s" x="816" y="1430">hosts</text>
  <text class="s" x="650" y="1452">Claude Code · Codex · Cursor · Copilot · Kimi …</text>
</svg>
