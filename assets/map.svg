  <text class="mono ink" x="76" y="890">detailed-domain-design</text>
  <text class="s" x="272" y="890">对象、关系、仓储长什么样</text>
  <rect class="humanbg" x="40" y="904" width="26" height="20" rx="5"/><text class="s human" x="53" y="918" text-anchor="middle" style="font-weight:700">6</text>
  <text class="mono ink" x="76" y="918">formal-docs-landing</text>
  <text class="s" x="272" y="918">哪些写成正式文档，落在哪层</text>
