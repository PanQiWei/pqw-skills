  <rect class="humanbg" x="40" y="764" width="26" height="20" rx="5"/><text class="s human" x="53" y="778" text-anchor="middle" style="font-weight:700">1</text>
  <text class="mono ink" x="76" y="778">requirement-and-invariants</text>
  <text class="s" x="272" y="778">给用户什么能力，永远守住什么</text>
  <rect class="humanbg" x="40" y="792" width="26" height="20" rx="5"/><text class="s human" x="53" y="806" text-anchor="middle" style="font-weight:700">2</text>
